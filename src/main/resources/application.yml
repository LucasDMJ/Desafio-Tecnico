server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:h2:mem:customersdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false

# Integracao com o servico externo de score
score-service:
  base-url: ${SCORE_SERVICE_URL:http://localhost:8089}
  connect-timeout: ${SCORE_SERVICE_CONNECT_TIMEOUT:2s}
  read-timeout: ${SCORE_SERVICE_READ_TIMEOUT:3s}

# Usuarios (Basic Authentication) - sobrescreva via variaveis de ambiente
app:
  security:
    users:
      - username: ${APP_USER_USERNAME:user}
        password: ${APP_USER_PASSWORD:user123}
        role: USER
      - username: ${APP_ADMIN_USERNAME:admin}
        password: ${APP_ADMIN_PASSWORD:admin123}
        role: ADMIN
